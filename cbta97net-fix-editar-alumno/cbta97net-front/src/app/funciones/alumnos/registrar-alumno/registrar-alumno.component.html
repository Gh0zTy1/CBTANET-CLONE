<div class="flex flex-col h-full">
    <header class="mb-(--space-6)">
        <div class="flex flex-col">
            <h1 class="text-(length:--text-title) font-bold">Registrar Alumno</h1>
            <p class="text-gray-400 text-(length:--text-md) font-regular">Ingrese los datos personales y documentos del alumno.</p>
        </div>
    </header>
    
    <form>
        <formulario-imagen #formularioImagen />
        <formulario-info-alumnos #formularioAlumnos />
        <formulario-documentos #formularioDocumentos />
    
        <div class="w-full flex justify-end mb-(--space-6)">
            <div class="w-48">
                <app-button
                    #botonRegistrar 
                    class="adapted large"
                    placeHolder = "Registrar Alumno"
                    (clicked)="manejarRegistroAlumno($event)"
                />
            </div>
        </div>
    </form>
</div>
