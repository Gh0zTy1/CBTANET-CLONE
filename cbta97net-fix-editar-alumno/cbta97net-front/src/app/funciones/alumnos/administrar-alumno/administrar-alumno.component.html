<div>
    <header class="mb-(--space-6)">
        <div class="flex flex-col">
            <h1 class="text-(length:--text-title) font-bold">Consultar Alumno</h1>
            <p class="text-gray-400 text-(length:--text-md)">Buscar por matrícula para ver la información detallada.</p>
        </div>
    </header>

    <div class="w-full inline-flex items-center justify-between mb-4 gap-2">
        <div class="w-[40%]">
            <input-search 
                #searchInput
                max="50"
                placeHolder="Ingrese la matrícula, CURP o nombre del alumno"
                (inputChange)="alTeclear()"
            />
        </div>
        <div class="w-32">
            <app-button
                #importButton
                size="default"
                icon="upload_file"
                iconSize="sm"
                type="default"
                shape="default"
                placeHolder="Importar"
                (clicked)="abrirModalInsercionMasiva($event)"
            />
        </div>
    </div>

    <div class="space-y-2">
        <div>
            <app-tabla-busqueda-alumnos
                #studentsTable
                (enEliminacionAlumno)="confirmarEliminacionAlumno($event)"
            />
        </div>
        <paginator
            #paginator
            (onPageChanged)="manejarCambioDePagina()"
        />
    </div>

    <modal-massive-insertion #modalMassiveInsertion />
</div>
