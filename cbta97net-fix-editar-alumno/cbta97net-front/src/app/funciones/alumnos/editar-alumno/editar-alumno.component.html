<div class="flex flex-col h-full" [class.hidden]="_estaCargando()">
    <header class="mb-(--space-6)">
        <div class="flex flex-col">
            <div class="header-text">
                <h1 class="text-(length:--text-title) font-bold">Edicion de Alumno</h1>
                <p class="text-gray-400 text-(length:--text-md) font-regular">Ingrese los datos personales y documentos del alumno.</p>
            </div>
        </div>
    </header>

    <form>
        <formulario-imagen #formularioImagen />
        <formulario-info-alumnos #formularioAlumnos />
        <formulario-documentos #formularioDocumentos />
    </form>
</div>

@if(_estaCargando()){
    <loading-screen-primary 
        #loadingScreen
        (returnAction)="manejarRetornoEnError($event)"
    />
}
