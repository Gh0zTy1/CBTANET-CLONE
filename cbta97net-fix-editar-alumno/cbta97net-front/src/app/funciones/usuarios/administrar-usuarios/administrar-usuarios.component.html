
<div>
    <header class="mb-(--space-6)">
        <div class="flex flex-col">
            <h1 class="text-(length:--text-title) font-bold">Administrar Usuarios</h1>
            <p class="text-gray-400 text-(length:--text-md) font-regular">Buscar a los usuarios por su ID, CURP o nombre.</p>
        </div>
    </header>
    <div class="w-[40%] mb-(--space-4)">
        <input-search 
            #searchInput
            placeHolder="Ingrese el ID, CURP o nombre del usuario"
            (inputChange)="alTeclear()"
        />
    </div>

    
    <div class="space-y-2">
        <div>
            <app-tabla-usuarios
                #usersTable
                (enEliminacionUsuario)="confirmarEliminacionUsuario($event)"
            />
        </div>
        <paginator
            #paginator
            (onPageChanged)="manejarCambioDePagina()"
        />
    </div>
</div>
