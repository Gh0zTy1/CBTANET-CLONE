<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear Nuevo Grupo de Actividad Paraescolar</title>
  <link rel="stylesheet" href="CrearNuevoGrupoParaescolares.css" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link rel="stylesheet" href="AgregarClaseParaescolar/AgregarClaseParaescolar.css">

</head>

<body>
  <div class="container">
    <header>
      <div class="header-content">
        <img src="../resources/cbtalogo.jpeg" alt="Logo" class="logo" />
        <div class="header-text">
          <h1>Crear Nuevo Grupo de Actividad Paraescolar</h1>
          <p class="subtitle">Cargando ciclo escolar...</p>
        </div>
      </div>
    </header>
    <form class="group-details">
      <div class="form-field">
        <div class="form-group">
          <label for="group-letter">Nombre del Grupo</label>
          <input type="text" id="group-letter" placeholder="Ingresa un nombre" maxlength="25" />
        </div>
        <!-- <div class="form-group">
            <label for="group-name">Nota del grupo</label>
            <input type="text" id="group-name" placeholder="Nota" />
          </div> -->
      </div>

      <!-- <div class="form-field">
          <label for="turno">Turno</label>
          <select id="turno">
            <option value="matutino">Matutino</option>
            <option value="vespertino">Vespertino</option>
          </select>
        </div> -->
      <div class="form-field">
        <label for="semestre">Semestre</label>
        <select id="semestre">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
        </select>
      </div>
      <div class="form-field">
        <label for="actividades">Actividades a elegir</label>
        <select id="actividades">
          <!-- <option value=""></option> -->
        </select>
      </div>
      <!-- <div class="form-field">
          <label for="carrera">Carrera</label>
          <select id="carrera">
            <option value="tronco-comun">Tronco Común</option>
          </select>
        </div> -->


      <div class="form-field">
        <div class="form-group">
          <label for="cupo-maximo">Cupo Maximo</label>
          <input type="text" id="cupo-maximo" placeholder="Defina el cupo maximo" maxlength="2" />
        </div>
        <!-- <div class="form-group">
            <label for="group-name">Nota del grupo</label>
            <input type="text" id="group-name" placeholder="Nota" />
          </div> -->
      </div>




      <!-- <div class="form-field">
        <label for="area-propedeutica">Área Propedéutica</label>
        <select id="area-propedeutica">
          <option value="ninguna">Ninguna</option>
        </select>
      </div> -->
    </form>

    <hr />

    <main class="main-container">
      <div class="materias-column">
        <!-- <div class="materias-container">
          <h3>Materias disponibles</h3>
          <div id="materias-list" class="materias-list"></div>
        </div> -->

      <div class="selected-activity-container" style="margin: 20px 0; padding: 15px; background: #f8f9fa; border-radius: 8px;">
  <h3 style="margin-bottom: 10px;">Actividad Seleccionada</h3>
  <div id="selected-activity-display">
    <!-- Aquí aparecerá la actividad seleccionada con el botón + -->
  </div>
</div>

      </div>

      <div class="horario-column">
        <div class="schedule-section">
          <h2>Horario</h2>
          <div class="schedule-container">
            <table class="schedule-table">
              <thead>
                <tr>
                  <th>Hora</th>
                  <th>Lunes</th>
                  <th>Martes</th>
                  <th>Miércoles</th>
                  <th>Jueves</th>
                  <th>Viernes</th>
                  <th>Sábado</th>
                  <!-- <th>Domingo</th> -->
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>

    <footer class="form-actions">
      <button class="btn btn-primary" id="create-group-btn">
        Crear grupo
      </button>
      <button class="btn btn-secondary" type="button" id="btn-cancelar-grupo">Cancelar</button>
    </footer>
  </div>

  <div id="modal-container"></div>

  <script src="AgregarClaseParaescolar/AgregarClaseParaescolar.js"></script>
<script src="CrearNuevoGrupoParaescolares.js"></script>


</body>

</html>
