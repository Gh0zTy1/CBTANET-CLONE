<!-- Modal para asignar actividad paraescolar -->



<div id="addClassModal" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Agregar actividad - Horario</h2>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label for="modal-actividad-name">Actividad</label>
        <input type="text" id="modal-actividad-name" disabled>
      </div>

      <div class="form-group">
        <label>Horarios</label>
        <div class="horario-adder">
          <select id="horario-dia">
            <option value="0">Lunes</option>
            <option value="1">Martes</option>
            <option value="2">Miércoles</option>
            <option value="3">Jueves</option>
            <option value="4">Viernes</option>
            <option value="5">Sábado</option>
          </select>

          <select id="horario-inicio">
            <option value="">Inicio</option>
            <option value="07:00">07:00</option>
            <option value="08:00">08:00</option>
            <option value="09:00">09:00</option>
            <option value="10:00">10:00</option>
            <option value="11:00">11:00</option>
            <option value="12:00">12:00</option>
            <option value="13:00">13:00</option>
          </select>

          <select id="horario-fin">
            <option value="">Fin</option>
            <option value="08:00">08:00</option>
            <option value="09:00">09:00</option>
            <option value="10:00">10:00</option>
            <option value="11:00">11:00</option>
            <option value="12:00">12:00</option>
            <option value="13:00">13:00</option>
            <option value="14:00">14:00</option>
          </select>

          <button id="add-horario-btn" class="add-btn">+</button>
        </div>

        <table class="horarios-list-table">
          <thead>
            <tr>
              <th>Día</th>
              <th>Inicio</th>
              <th>Fin</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="horarios-list-body"></tbody>
        </table>
      </div>

      <div class="form-group">
        <label for="modal-instructor">Instructor</label>
        <select id="modal-instructor">
          <option value="">Selecciona un instructor</option>
        </select>
      </div>
    </div>

    <div class="modal-footer">
      <button id="cancel-btn" class="btn btn-secondary">Cancelar</button>
      <button id="confirm-btn" class="btn btn-primary">Confirmar</button>
    </div>
  </div>
</div>
<script src="AgregarClaseParaescolar.js"></script>
